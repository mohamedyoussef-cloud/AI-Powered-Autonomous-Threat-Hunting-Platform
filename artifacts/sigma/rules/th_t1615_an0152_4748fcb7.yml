title: "Group Policy Discovery - Analytic 0152 Baseline"
id: "4748fcb7-65d3-5d69-a822-0d3605d3b96b"
status: "experimental"
description: "Detection of adversary attempts to enumerate Group Policy settings through suspicious command execution (gpresult), PowerShell enumeration (Get-DomainGPO, Get-DomainGPOLocalGroup), and abnormal LDAP queries targeting groupPolicyContainer objects. Defenders observe unusual process lineage, script execution, or LDAP filter activity against domain controllers."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1615"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon, WinEventLog:PowerShell"
detection:
    keywords:
        - "PowerShell"
        - "DomainGPO"
        - "DomainGPOLocalGroup"
        - "Get-DomainGPO"
        - "Get-DomainGPOLocalGroup"
    condition: "keywords"
falsepositives:
    - "Unknown"
