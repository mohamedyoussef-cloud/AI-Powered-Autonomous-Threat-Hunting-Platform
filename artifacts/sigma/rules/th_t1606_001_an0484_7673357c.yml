title: "Web Cookies - Analytic 0484 Baseline"
id: "7673357c-4ebd-5605-8ec9-38cedc80fa91"
status: "experimental"
description: "Forged web cookies on Windows endpoints can be detected by monitoring unusual modifications of browser cookie stores (e.g., Chrome SQLite DB, Edge cache) by processes outside of browsers, followed by authentication events to SaaS or IaaS services. Defenders may observe processes writing directly to cookie storage paths or injecting tokens into browser sessions."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1606.001"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Sysmon, WinEventLog:Security"
detection:
    keywords:
        - "SQLite"
    condition: "keywords"
falsepositives:
    - "Unknown"
