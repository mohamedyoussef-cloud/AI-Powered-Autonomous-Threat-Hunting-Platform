title: "HTML Smuggling - Analytic 0872 Baseline"
id: "356d31c0-cb01-5a4e-acce-169450b1e969"
status: "experimental"
description: "Detection of browser-based or email client-driven file creation (often from temp directories) following navigation to or execution of HTML files containing JavaScript Blob APIs or base64 Data URLs, with follow-on execution of the dropped payload. Leveraging Sysmon EventID 15 to inspect Zone.Identifier ADS for HostUrl/ReferrerUrl indicators (e.g., HostUrl=about:internet). Optional: absence of a large HTTP download record for the same URL/client in proxy logs (suggests local assembly)"
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1027.006"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "JavaScript"
        - "EventID"
        - "HostUrl"
        - "ReferrerUrl"
        - "browser-based"
        - "client-driven"
        - "follow-on"
    condition: "keywords"
falsepositives:
    - "Unknown"
