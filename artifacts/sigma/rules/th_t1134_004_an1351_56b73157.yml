title: "Parent PID Spoofing - Analytic 1351 Baseline"
id: "56b73157-1232-5646-9c20-2351625db716"
status: "experimental"
description: "A process explicitly forges its parent using EXTENDED_STARTUPINFO + PROC_THREAD_ATTRIBUTE_PARENT_PROCESS (UpdateProcThreadAttribute → CreateProcess[A/W]/CreateProcessAsUserW) or other Native API paths, resulting in **mismatched/implausible lineage** across ETW EventHeader ProcessId, Security 4688 Creator Process ID/Name, and sysmon ParentProcessGuid. Often paired with privilege escalation when the chosen parent runs as SYSTEM."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1134.004"
logsource:
    product: "windows"
    service: "security"
    definition: "Grounded source(s): WinEventLog:Security"
detection:
    keywords:
        - "UpdateProcThreadAttribute"
        - "CreateProcess"
        - "CreateProcessAsUserW"
        - "EventHeader"
        - "ProcessId"
        - "ParentProcessGuid"
        - "SYSTEM"
    condition: "keywords"
falsepositives:
    - "Unknown"
