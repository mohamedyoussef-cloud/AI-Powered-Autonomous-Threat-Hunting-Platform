title: "Group Policy Preferences - Analytic 1075 Baseline"
id: "262297bc-9024-5936-ac9e-af607b2781d2"
status: "experimental"
description: "Correlates file enumeration of XML files in the SYSVOL share with suspicious process execution that decodes or reads encrypted credentials embedded in Group Policy Preference files (e.g., Get-GPPPassword.ps1, gpprefdecrypt.py, Metasploit). Detects abnormal access to \\DOMAIN\\SYSVOL combined with XML file parsing or decryption logic."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1552.006"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Sysmon, WinEventLog:Security, WinEventLog:PowerShell"
detection:
    keywords:
        - "SYSVOL"
        - "GPPPassword"
        - "DOMAIN"
        - "Get-GPPPassword"
    condition: "keywords"
falsepositives:
    - "Unknown"
