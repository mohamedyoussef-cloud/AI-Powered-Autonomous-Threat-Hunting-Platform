title: "Remote Service Session Hijacking - Analytic 0216 Baseline"
id: "172ef763-b5c7-569c-8b56-8a231399a17d"
status: "experimental"
description: "Detection of anomalous RDP or remote service session activity where a logon session is hijacked rather than newly created. Indicators include mismatched user credentials vs. active session tokens, service session takeovers without corresponding successful logon events, or RDP shadowing activity without user consent."
