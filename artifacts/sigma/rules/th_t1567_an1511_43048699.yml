title: "Exfiltration Over Web Service - Analytic 1511 Baseline"
id: "43048699-ca25-5b8c-a066-b613fcc6e123"
status: "experimental"
description: "Processes that normally do not initiate network communications suddenly making outbound HTTPS connections with high outbound-to-inbound data ratios. Defender view: correlation between process creation logs (e.g., Word, Excel, PowerShell) and subsequent anomalous network traffic volumes toward common web services (Dropbox, Google Drive, OneDrive)."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1567"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "PowerShell"
        - "OneDrive"
        - "outbound-to-inbound"
    condition: "keywords"
falsepositives:
    - "Unknown"
