status: "experimental"
description: "Execution of trusted, Microsoft-signed binaries such as `rundll32.exe`, `msiexec.exe`, or `regsvr32.exe` used to execute externally hosted, unsigned, or suspicious payloads through command-line parameters or network retrieval."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
