title: "Forge Web Credentials - Analytic 0719 Baseline"
id: "bdcc7f3d-ae53-5400-8f92-fcf51d68eae2"
status: "experimental"
description: "Forged web credentials on Windows endpoints may be detected by anomalous browser cookie files, local token cache manipulations, or tools injecting tokens into sessions. Defenders may observe processes accessing LSASS or browser credential stores unexpectedly, followed by unusual logon sessions."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1606"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Sysmon, WinEventLog:Security"
detection:
    keywords:
        - "Forged web credentials on Windows endpoints may be detected by anomalous browser cookie files, local token cache manipulations, or tools injecting tokens into sessions. Defenders may observe processes accessing LSASS or browser credential stores unexpectedly, followed by unusual logon sessions."
    condition: "keywords"
falsepositives:
    - "Unknown"
