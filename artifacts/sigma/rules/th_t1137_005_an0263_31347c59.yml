title: "Outlook Rules - Analytic 0263 Baseline"
id: "31347c59-3370-50b1-9571-dde9391a5e60"
status: "experimental"
description: "Adversary uses a tool like Ruler or MFCMapi to create a malicious Outlook rule that triggers execution upon receipt of a crafted email. On email delivery, Outlook executes the rule, resulting in code execution (e.g., launching mshta.exe or PowerShell). Outlook spawns a non-standard child process, often unsanctioned, without user interaction."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1137.005"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Sysmon, WinEventLog:Application, WinEventLog:PowerShell"
detection:
    keywords:
        - "mshta.exe"
        - "MFCMapi"
        - "PowerShell"
        - "non-standard"
    condition: "keywords"
falsepositives:
    - "Unknown"
