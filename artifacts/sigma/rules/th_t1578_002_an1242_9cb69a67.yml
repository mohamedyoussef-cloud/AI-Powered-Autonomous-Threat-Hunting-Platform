title: "Create Cloud Instance - Analytic 1242 Baseline"
id: "9cb69a67-fe37-57de-96a8-48a27cd530c0"
status: "experimental"
description: "Detection focuses on abnormal or unauthorized cloud instance creation events. From a defender’s perspective, suspicious behavior includes VM/instance creation by rarely used or newly created accounts, creation events from unusual geolocations, or rapid sequences of snapshot creation followed by instance creation and mounting. Unexpected network or IAM policy changes applied to new instances can indicate adversarial use rather than legitimate provisioning."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
