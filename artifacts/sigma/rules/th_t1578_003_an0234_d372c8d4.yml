title: "Delete Cloud Instance - Analytic 0234 Baseline"
id: "d372c8d4-e37a-5a98-a1fc-33e7e7580789"
status: "experimental"
description: "Defenders can detect suspicious cloud instance deletions by correlating events across authentication, instance lifecycle, and account activity. From a defender’s perspective, behaviors of interest include instances deleted shortly after creation, deletions initiated by new or rarely used accounts, deletions following snapshot creation, and deletions originating from anomalous geolocations or access keys. These may indicate adversarial attempts to destroy forensic evidence or evade detection."
