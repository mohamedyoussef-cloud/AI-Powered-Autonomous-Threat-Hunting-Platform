title: "Outlook Forms - Analytic 0085 Baseline"
id: "b4d8b8ce-e26c-5ee5-a3e5-11ae141ff7b8"
status: "experimental"
description: "Adversary uses a tool like Ruler to insert a malicious custom form into the user's Outlook mailbox. The form is designed to auto-execute on Outlook startup or on receipt of a specially crafted email. This results in child processes launched from outlook.exe and possibly network connections or payload loading."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1137.003"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Sysmon, WinEventLog:Application, WinEventLog:PowerShell"
detection:
    keywords:
        - "outlook.exe"
        - "auto-execute"
    condition: "keywords"
falsepositives:
    - "Unknown"
