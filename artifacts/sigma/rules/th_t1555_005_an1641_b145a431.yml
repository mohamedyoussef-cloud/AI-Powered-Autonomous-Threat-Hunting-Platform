title: "Password Managers - Analytic 1641 Baseline"
id: "b145a431-d2a3-536f-9b8a-13e3c9989891"
status: "experimental"
description: "Detection of suspicious access to password manager processes (KeePass, 1Password, LastPass, Bitwarden) through abnormal process injection, memory reads, or command-line usage of vault-related DLLs. Correlates process creation with OS API calls and file access to vault databases (.kdbx, .opvault, .ldb)."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1555.005"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "KeePass"
        - "LastPass"
        - "command-line"
        - "vault-related"
    condition: "keywords"
falsepositives:
    - "Unknown"
