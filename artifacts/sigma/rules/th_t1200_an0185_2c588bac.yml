title: "Hardware Additions - Analytic 0185 Baseline"
id: "2c588bac-b6d5-541b-af04-961adafb89cb"
status: "experimental"
description: "Chain: (1) a new external device is recognized by Windows (USB/Thunderbolt/PCIe) or a new block device appears; (2) within a short window, the same user/session spawns processes or the OS mounts a new volume; (3) optional follow-on activity such as HID keystroke injection, DMA driver load, or new network interface MAC on DHCP. Correlate Security EID 6416 / Kernel-PnP with sysmon and DHCP/network metadata."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
