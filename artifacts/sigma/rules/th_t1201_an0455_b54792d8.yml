title: "Password Policy Discovery - Analytic 0455 Baseline"
id: "b54792d8-45af-547a-a4f5-455d0e1e4bd5"
status: "experimental"
description: "Cause→effect chain: (1) a user or service spawns a shell/PowerShell that queries local/domain password policy via commands/cmdlets (e.g., `net accounts`, `Get-ADDefaultDomainPasswordPolicy`, `secedit /export`); (2) optional directory/LDAP reads from DCs; (3) same principal performs adjacent Discovery or credential-related actions within a short window. Correlate sysmon process creation with PowerShell ScriptBlock and Security logs."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1201"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:PowerShell, WinEventLog:Security"
detection:
    keywords:
        - "net accounts"
        - "Get-ADDefaultDomainPasswordPolicy"
        - "secedit /export"
        - "PowerShell"
        - "ADDefaultDomainPasswordPolicy"
        - "ScriptBlock"
        - "credential-related"
    condition: "keywords"
falsepositives:
    - "Unknown"
