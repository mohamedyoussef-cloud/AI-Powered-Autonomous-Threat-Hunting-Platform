title: "Web Cookies - Analytic 0485 Baseline"
id: "63a8db18-2d56-539b-a882-ad0bb8679cd1"
status: "experimental"
description: "On Linux, defenders may observe forged cookie activity as unauthorized modifications to browser cookie databases (e.g., ~/.mozilla/firefox/*/cookies.sqlite, ~/.config/chromium/Default/Cookies) or scripted injection of session tokens. Suspicious usage includes curl/wget commands embedding forged cookies in headers, correlated with abnormal session activity in SaaS or IaaS logs."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1606.001"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "On Linux, defenders may observe forged cookie activity as unauthorized modifications to browser cookie databases (e.g., ~/.mozilla/firefox/*/cookies.sqlite, ~/.config/chromium/Default/Cookies) or scripted injection of session tokens. Suspicious usage includes curl/wget commands embedding forged cookies in headers, correlated with abnormal session activity in SaaS or IaaS logs."
    condition: "keywords"
falsepositives:
    - "Unknown"
