description: "Detects JavaScript execution through WSH (wscript.exe, cscript.exe) or HTA (mshta.exe), particularly when spawned from Office macros, web browsers, or abnormal user paths. Correlates script execution with outbound network activity or system modification."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
