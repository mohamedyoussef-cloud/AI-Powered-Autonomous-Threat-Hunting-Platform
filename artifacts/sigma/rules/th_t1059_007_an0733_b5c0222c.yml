logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "wscript.exe"
        - "cscript.exe"
        - "mshta.exe"
        - "JavaScript"
    condition: "keywords"
falsepositives:
    - "Unknown"
