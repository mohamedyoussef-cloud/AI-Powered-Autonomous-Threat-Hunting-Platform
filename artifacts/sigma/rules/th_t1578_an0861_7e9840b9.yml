title: "Modify Cloud Compute Infrastructure - Analytic 0861 Baseline"
id: "7e9840b9-5f5e-513a-a14d-f50489e645f3"
status: "experimental"
description: "Detection focuses on identifying unauthorized or anomalous changes to compute infrastructure components. Defender perspective: monitor for creation, deletion, or modification of instances, volumes, and snapshots outside of approved change management windows; correlate abnormal activity such as rapid snapshot creation followed by new instance mounts, or repeated infrastructure changes by rarely used accounts. Flagging activity linked to unusual geolocation, API client, or automation script is suspicious."
