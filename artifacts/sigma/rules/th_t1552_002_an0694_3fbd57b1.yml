title: "Credentials in Registry - Analytic 0694 Baseline"
id: "3fbd57b1-deb1-5c54-af7b-6d74bbd77aea"
status: "experimental"
description: "Defenders observe command-line executions or API-based registry reads targeting sensitive paths like HKLM or HKCU with keyword filters such as 'password', 'cred', or 'logon'. Typically performed by Reg.exe, PowerShell, custom binaries, or offensive tools such as Cobalt Strike. Correlation with process ancestry and command-line arguments indicates suspicious credential discovery activity."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1552.002"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "password"
        - "cred"
        - "logon"
        - "Reg.exe"
        - "PowerShell"
        - "command-line"
        - "API-based"
    condition: "keywords"
falsepositives:
    - "Unknown"
