title: "Group Policy Modification - Analytic 0854 Baseline"
id: "5c4ea71d-553c-54ca-92c4-678e404c528f"
status: "experimental"
description: "Adversary modifies GPO containers or files under SYSVOL using LDAP, ADSI, PowerShell (e.g., New-GPOImmediateTask) or GUI tools. This includes directory object changes (e.g., gPCFileSysPath), delegation assignments (SeEnableDelegationPrivilege), and SYSVOL file writes (ScheduledTasks.xml, GptTmpl.inf)."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1484.001"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "SYSVOL"
        - "PowerShell"
        - "GPOImmediateTask"
        - "SeEnableDelegationPrivilege"
        - "ScheduledTasks"
        - "GptTmpl"
        - "New-GPOImmediateTask"
    condition: "keywords"
falsepositives:
    - "Unknown"
