title: "Disable or Modify Windows Event Log - Analytic 0535 Baseline"
id: "1fba6657-d3eb-52b1-84fa-36045d7f76d7"
status: "experimental"
description: "Detection of attempts to disable or tamper with Windows Event Logging. This includes stopping or disabling the EventLog service, modifying registry keys related to EventLog and Autologger, using `auditpol` or `wevtutil` to disable categories or clear audit policies, and detecting suspicious gaps or resets in event logs. Defenders observe registry changes, service state changes, process execution of disabling commands, and anomalies in event record sequences."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1685.001"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:System, WinEventLog:Sysmon"
detection:
    keywords:
        - "auditpol"
        - "wevtutil"
        - "EventLog"
    condition: "keywords"
falsepositives:
    - "Unknown"
