title: "Process Hollowing - Analytic 1076 Baseline"
id: "028ba46a-c729-52d0-ae0c-efc7b301b7c2"
status: "experimental"
description: "Detects adversary use of suspended process creation, using the CREATE_SUSPENDED flag via CreateProcess, followed by unmapping the memory of the child process (NtUnmapViewOfSection) and replacing it with malicious code via VirtualAllocEx/WriteProcessMemory, then SetThreadContext and ResumeThread to begin execution within the hollowed process."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1055.012"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "CreateProcess"
        - "NtUnmapViewOfSection"
        - "VirtualAllocEx"
        - "WriteProcessMemory"
        - "SetThreadContext"
        - "ResumeThread"
    condition: "keywords"
falsepositives:
    - "Unknown"
