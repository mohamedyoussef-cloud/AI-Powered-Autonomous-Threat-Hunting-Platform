title: "Command and Scripting Interpreter - Analytic 1428 Baseline"
id: "97f89df7-95f3-507a-8898-1ba54b4a316b"
status: "experimental"
description: "Detects the execution of scripting or command interpreters (e.g., powershell.exe, cmd.exe, wscript.exe) outside expected administrative time windows or from abnormal user contexts, often followed by encoded/obfuscated arguments or secondary execution events."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1059"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "powershell.exe"
        - "cmd.exe"
        - "wscript.exe"
    condition: "keywords"
falsepositives:
    - "Unknown"
