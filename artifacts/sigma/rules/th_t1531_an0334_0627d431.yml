title: "Account Access Removal - Analytic 0334 Baseline"
id: "0627d431-0e06-5235-9a1b-ffacf917911f"
status: "experimental"
description: "Correlated user account modification (reset, disable, deletion) events with anomalous process lineage (e.g., PowerShell or net.exe from an interactive session), especially outside of IT admin change windows or by non-admin users."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1531"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "net.exe"
        - "PowerShell"
        - "non-admin"
    condition: "keywords"
falsepositives:
    - "Unknown"
