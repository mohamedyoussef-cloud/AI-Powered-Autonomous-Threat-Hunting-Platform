title: "Service Execution - Analytic 1185 Baseline"
id: "c6d50695-10b7-5fde-bcb0-822c35a2cb41"
status: "experimental"
description: "Detection focuses on abnormal service executions initiated via service control manager APIs, sc.exe, net.exe, or PsExec creating temporary services. Defenders observe process creation of services.exe spawning non-standard binaries, registry changes in service keys followed by rapid execution, and network connections originating from processes tied to transient services. Correlation across process lineage, registry activity, and service logs provides strong signals of malicious service execution."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1569.002"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "sc.exe"
        - "net.exe"
        - "services.exe"
        - "PsExec"
        - "non-standard"
    condition: "keywords"
falsepositives:
    - "Unknown"
