title: "Debugger Evasion - Analytic 1045 Baseline"
id: "c3a98a7f-f559-5426-9c67-10b88e9925ef"
status: "experimental"
description: "Monitor for suspicious use of Windows API calls such as IsDebuggerPresent() and NtQueryInformationProcess(), or processes manually checking the BeingDebugged flag in the Process Environment Block (PEB). Detect sequences of OutputDebugStringW() calls in short intervals that may indicate debugger flooding attempts."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1622"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "IsDebuggerPresent"
        - "NtQueryInformationProcess"
        - "BeingDebugged"
        - "OutputDebugStringW"
    condition: "keywords"
falsepositives:
    - "Unknown"
