title: "Malicious Copy and Paste - Analytic 0962 Baseline"
id: "f3efdce9-b2c7-593f-bffb-b32d1cd736bc"
status: "experimental"
description: "A user is socially engineered (web page, email, document) to open Run/PowerShell/CMD and paste an obfuscated one-liner. The chain is: (1) user context active in a browser/email/office app → (2) process creation of a command interpreter with suspicious arguments (base64/Invoke-Expression/web download/pipeline to shell) → (3) optional file drop in %TEMP% or %APPDATA% → (4) outbound network connection to an external domain. Events are correlated within a short window and with consistent user/session."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1204.004"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:PowerShell, WinEventLog:Sysmon"
detection:
    keywords:
        - "PowerShell"
        - "APPDATA"
        - "one-liner"
        - "Invoke-Expression"
    condition: "keywords"
falsepositives:
    - "Unknown"
