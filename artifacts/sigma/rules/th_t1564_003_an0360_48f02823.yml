title: "Hidden Window - Analytic 0360 Baseline"
id: "48f02823-544a-5526-81d7-ca7ad6f412f0"
status: "experimental"
description: "Suspicious use of scripting parameters or registry edits to hide process windows (e.g., powershell.exe -WindowStyle Hidden, or registry modifications pushing window positions off screen). Defender view: correlation of hidden execution with anomalous process lineage or hVNC-like CreateDesktop API calls."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1564.003"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "powershell.exe"
        - "WindowStyle"
        - "CreateDesktop"
        - "hVNC-like"
    condition: "keywords"
falsepositives:
    - "Unknown"
