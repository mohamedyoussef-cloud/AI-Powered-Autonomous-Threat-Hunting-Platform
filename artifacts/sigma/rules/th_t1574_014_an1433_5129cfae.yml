title: "AppDomainManager - Analytic 1433 Baseline"
id: "5129cfae-91cb-5660-b509-254bb9bea502"
status: "experimental"
description: "Detection focuses on unauthorized manipulation of .NET AppDomainManager behavior. Defenders may observe suspicious creation of new AppDomains within trusted processes, anomalous loading of assemblies via non-standard configuration files, or registry/environment variable changes redirecting AppDomainManager to malicious assemblies. Correlated events include config file tampering, new process creation of .NET host processes (e.g., w3wp.exe, powershell.exe) with modified runtime parameters, and module loads of unusual or unsigned .NET DLLs."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1574.014"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "w3wp.exe"
        - "powershell.exe"
        - "AppDomainManager"
        - "AppDomains"
        - "non-standard"
    condition: "keywords"
falsepositives:
    - "Unknown"
