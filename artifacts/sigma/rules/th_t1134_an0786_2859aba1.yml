title: "Access Token Manipulation - Analytic 0786 Baseline"
id: "2859aba1-608b-582d-8f0b-ef072dccfdce"
status: "experimental"
description: "Detection of suspicious token manipulation chains: use of token-related APIs (e.g., LogonUser, DuplicateTokenEx) or commands (runas) → spawning of a new process under a different security context (e.g., SYSTEM) → mismatched parent-child process lineage or anomalies in Event Tracing for Windows (ETW) token/PPID data → abnormal lateral or privilege escalation activity."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1134"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "LogonUser"
        - "DuplicateTokenEx"
        - "SYSTEM"
        - "token-related"
        - "parent-child"
    condition: "keywords"
falsepositives:
    - "Unknown"
