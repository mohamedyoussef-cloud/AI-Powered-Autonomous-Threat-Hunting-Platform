title: "Portable Executable Injection - Analytic 0297 Baseline"
id: "b03ac15f-7084-54c5-8d0d-aed008a8c160"
status: "experimental"
description: "Detects PE injection through a behavioral sequence where one process opens (OpenProcess) a handle to another, allocates remote memory (VirtualAllocEx), writes a PE header (MZ) or shellcode (WriteProcessMemory), then initiates a new thread (CreateRemoteThread or NtCreateThreadEx) in that process—executing injected code in memory without touching disk. Optional: injects a trampoline or shellcode that unpacks/reflectively maps the payload."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1055.002"
logsource:
    product: "windows"
    service: "sysmon"
    definition: "Grounded source(s): WinEventLog:Sysmon"
detection:
    keywords:
        - "OpenProcess"
        - "VirtualAllocEx"
        - "WriteProcessMemory"
        - "CreateRemoteThread"
        - "NtCreateThreadEx"
    condition: "keywords"
falsepositives:
    - "Unknown"
