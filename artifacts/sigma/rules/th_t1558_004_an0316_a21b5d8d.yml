title: "AS-REP Roasting - Analytic 0316 Baseline"
id: "a21b5d8d-06eb-582a-8ee1-db267fab731f"
status: "experimental"
description: "Detects AS-REP roasting attempts by monitoring for Kerberos AS-REQ/AS-REP authentication patterns where preauthentication is disabled (Event ID 4768 with Pre-Auth Type 0). Correlates these requests with subsequent service ticket activity (event telemetry) and anomalies such as requests using weak RC4 encryption (etype 0x17). Excessive enumeration of accounts with 'Do not require Kerberos preauthentication' set in Active Directory is another key detection point."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1558.004"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "Event ID 4768"
        - "Do not require Kerberos preauthentication"
        - "0x17"
        - "AS-REP"
        - "AS-REQ"
        - "Pre-Auth"
    condition: "keywords"
falsepositives:
    - "Unknown"
