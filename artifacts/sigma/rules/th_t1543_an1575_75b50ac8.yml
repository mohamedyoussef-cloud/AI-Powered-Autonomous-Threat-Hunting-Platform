title: "Create or Modify System Process - Analytic 1575 Baseline"
id: "75b50ac8-b860-5477-900b-e8e51316a932"
status: "experimental"
description: "Detects command-line or API-based creation/modification of Windows Services via `sc.exe`, `powershell.exe`, `services.exe`, or `ChangeServiceConfig`. Looks for creation/modification of autostart services via registry changes, file drops to `System32\\services`, and anomalous parent-child process trees."
author: "Autonomous Threat Hunting Platform"
date: "2026-08-18"
tags:
    - "attack.t1543"
logsource:
    product: "windows"
    definition: "Grounded source(s): WinEventLog:Security, WinEventLog:Sysmon"
detection:
    keywords:
        - "sc.exe"
        - "powershell.exe"
        - "services.exe"
        - "ChangeServiceConfig"
        - "System32\\services"
        - "command-line"
        - "API-based"
        - "parent-child"
    condition: "keywords"
falsepositives:
    - "Unknown"
